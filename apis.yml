aid: tractian
name: Tractian
description: >-
  Tractian is a machine intelligence company providing condition monitoring,
  asset performance management, and predictive maintenance for industrial
  operations. Smart Trac sensors capture real-time vibration, temperature, and
  energy data over LTE; patented AI analytics auto-diagnose over 75 failure
  modes, predict failures, and prescribe actions; and the Tractian CMMS manages
  work orders, spare parts inventory, maintenance scheduling, and maintenance
  KPI reporting. The platform integrates with ERPs, BI tools, and fleet systems
  through native SQL access, prebuilt connectors, and REST APIs, and is
  FedRAMP High authorized, SOC 2 Type II compliant, and ISO 27001 certified.
